              s = str(value).strip()
              candidates = [s]
              s2 = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
              s2 = re.sub(r"\s*```$", "", s2)
              if s2 != s:
                  candidates.append(s2)
              m = re.search(r"\{.*\}", s2, flags=re.S)
              if m:
                  candidates.append(m.group(0))
              for candidate in candidates:
                  try:
                      obj = json.loads(candidate)
                      if isinstance(obj, dict):
                          return obj, True, None
                  except Exception:
                      pass
              return {}, False, "World Builder output was not valid JSON"

          def loads(value, default):
              if isinstance(value, (dict, list)):
                  return copy.deepcopy(value)
              try:
                  return json.loads(value) if value is not None else copy.deepcopy(default)
              except Exception:
                  return copy.deepcopy(default)

          def current_turn(model):
              turn = int(model.get("turn_count", 0) or 0)
              facts = [
                  x for x in model.get("facts", [])
                  if isinstance(x, dict) and int(x.get("turn", 0) or 0) == turn
              ]
              instructions = [
                  x for x in model.get("instructions", [])
                  if isinstance(x, dict) and int(x.get("turn", 0) or 0) == turn
              ]
              return turn, facts, instructions

          def has_action(instructions, *types):
              wanted = set(types)
              return any(str(x.get("action_type") or "") in wanted for x in instructions)

          def has_state_fact(facts):
              return any(str(x.get("kind") or "") == "state" for x in facts)

          def mentions_score(facts, instructions):
              text = " ".join(
                  [str(x.get("statement") or "") for x in facts]
                  + [str(x.get("description") or "") for x in instructions]
              ).lower()
              return any(word in text for word in ("score", "point", "counter"))

          def add_violation(items, field, reason):
              items.append({"field": field, "reason": reason})

          def sanitize_new_object(obj, allow_state, violations):
              if not isinstance(obj, dict) or obj.get("id") is None:
                  return None
              out = {k: copy.deepcopy(v) for k, v in obj.items() if v is not None}
              # Interactivity is gameplay authority, not presentation.
              if out.get("interactive") is True:
                  out["interactive"] = False
                  add_violation(violations, f"add_objects.{obj.get('id')}.interactive", "interactivity was not student-grounded")
              state = str(out.get("state") or "")
              if state in GAME_STATES and not allow_state:
                  out["state"] = "available"
                  add_violation(violations, f"add_objects.{obj.get('id')}.state", "gameplay state was not student-grounded")
              # Ownership is gameplay-relevant; never infer a non-empty owner on a new object.
              if out.get("owner") not in (None, ""):
                  out["owner"] = None
                  add_violation(violations, f"add_objects.{obj.get('id')}.owner", "ownership was not student-grounded")
              return out

          def main(world_builder_text: str, student_model_json: str, render_model_json: str, summary_json: str) -> dict:
              builder, parse_ok, parse_error = loads_status(world_builder_text)
              student = loads(student_model_json, {"facts": [], "instructions": [], "turn_count": 0})
              render = loads(render_model_json, {"surface": None, "objects": []})
              summary = loads(summary_json, {})
              _, facts, instructions = current_turn(student)

              raw = builder.get("proposed_world_patch")
              if not isinstance(raw, dict):
                  raw = {}

              violations = []
              provenance = []

              allow_state = has_action(instructions, "set_state") or has_state_fact(facts)
              allow_turn = has_action(instructions, "switch_turn", "keep_turn")
              allow_remove = has_action(instructions, "remove")
              allow_counters = mentions_score(facts, instructions)

              patch = {}

              # Harmless representation metadata may be inferred.
              for key in ("name", "status"):
                  if raw.get(key) not in (None, ""):
                      patch[key] = raw.get(key)
                      provenance.append({"field": key, "source": "presentation_inference", "evidence": ""})

              if isinstance(raw.get("surface"), dict):
                  patch["surface"] = copy.deepcopy(raw["surface"])
                  for key in raw["surface"]:
                      provenance.append({"field": f"surface.{key}", "source": "presentation_inference", "evidence": ""})

              # "ready" may become true only after the child has actually supplied an instruction.
              if "ready" in raw:
                  requested = bool(raw.get("ready"))
                  if requested and not instructions:
                      add_violation(violations, "ready", "ready=true without a student-grounded instruction")
                  else:
                      patch["ready"] = requested
                      if requested:
                          provenance.append({"field": "ready", "source": "student", "evidence": ""})

              if raw.get("turn") is not None:
                  if allow_turn:
                      patch["turn"] = raw.get("turn")
                      provenance.append({"field": "turn", "source": "student", "evidence": ""})
                  else:
                      add_violation(violations, "turn", "turn state was not student-grounded")

              adds = []
              for obj in raw.get("add_objects", []) or []:
                  clean = sanitize_new_object(obj, allow_state, violations)
                  if clean:
                      adds.append(clean)
                      oid = clean.get("id")
                      provenance.append({"field": f"add_objects.{oid}", "source": "presentation_inference", "evidence": ""})
                      if allow_state and "state" in clean:
                          provenance.append({"field": f"add_objects.{oid}.state", "source": "student", "evidence": ""})
              if adds:
                  patch["add_objects"] = adds

              updates = []
              for obj in raw.get("update_objects", []) or []:
                  if not isinstance(obj, dict) or obj.get("id") is None:
                      continue
                  oid = str(obj.get("id"))
                  clean = {"id": obj.get("id")}
                  for key, value in obj.items():
                      if key == "id" or value is None:
                          continue
                      if key == "interactive":
                          add_violation(violations, f"update_objects.{oid}.interactive", "interactivity changes require gameplay authority")
                          continue
                      if key == "state":
                          if allow_state:
                              clean[key] = value
                              provenance.append({"field": f"update_objects.{oid}.state", "source": "student", "evidence": ""})
                          else:
                              add_violation(violations, f"update_objects.{oid}.state", "state update was not student-grounded")
                          continue
                      if key == "owner":
                          add_violation(violations, f"update_objects.{oid}.owner", "ownership update was not student-grounded")
                          continue
                      # Presentation fields are allowed only as proposed deltas; Pack World still prevents
                      # overwriting an existing non-empty presentation choice without student provenance.
                      clean[key] = copy.deepcopy(value)
                      provenance.append({"field": f"update_objects.{oid}.{key}", "source": "presentation_inference", "evidence": ""})
                  if len(clean) > 1:
                      updates.append(clean)
              if updates:
                  patch["update_objects"] = updates

              removes = raw.get("remove_object_ids", []) or []
              if removes:
                  if allow_remove:
                      patch["remove_object_ids"] = copy.deepcopy(removes)
                      for oid in removes:
                          provenance.append({"field": f"{oid}.remove", "source": "student", "evidence": ""})
                  else:
                      add_violation(violations, "remove_object_ids", "object removal was not student-grounded")

              if raw.get("counters") is not None:
                  if allow_counters:
                      patch["counters"] = copy.deepcopy(raw.get("counters") or [])
                      provenance.append({"field": "counters", "source": "student", "evidence": ""})
                  elif raw.get("counters"):
                      add_violation(violations, "counters", "score/counter meaning was not student-grounded")

              result = {
                  "world_patch": patch,
                  "provenance": provenance,
                  "violations": violations,
                  "parse_ok": parse_ok,
                  "parse_error": parse_error,
                  "builder_had_patch": bool(raw),
                  "builder_add_object_count": len(raw.get("add_objects", []) or []) if isinstance(raw, dict) else 0,
                  "guard_add_object_count": len(patch.get("add_objects", []) or [])
              }
              return {"text": json.dumps(result, ensure_ascii=False)}
