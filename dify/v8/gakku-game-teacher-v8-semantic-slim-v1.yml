        code: |-
          import json, re, copy

          def loads(value, default):
              if value is None:
                  return copy.deepcopy(default)
              if isinstance(value, (dict, list)):
                  return copy.deepcopy(value)
              try:
                  return json.loads(value)
              except Exception:
                  s = str(value).strip()
                  s = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
                  s = re.sub(r"\s*```$", "", s)
                  m = re.search(r"\{.*\}", s, flags=re.S)
                  if m:
                      try:
                          return json.loads(m.group(0))
                      except Exception:
                          pass
                  return copy.deepcopy(default)

          def valid_gap(value):
              if not isinstance(value, dict):
                  return None
              missing = str(value.get("missing_for_next_action") or "").strip()
              if not missing:
                  return None
              return {
                  "context": str(value.get("context") or "").strip(),
                  "missing_for_next_action": missing,
                  "reason": str(value.get("reason") or "").strip()
              }

          def valid_deferred_action(value):
              if not isinstance(value, dict):
                  return None
              action_type = str(value.get("type") or "").strip()
              allowed = {"reveal_object", "hide_object", "remove_object", "update_object", "set_turn", "set_counter", "set_status"}
              if action_type not in allowed:
                  return None
              try:
                  count = max(1, int(value.get("count") or 1))
              except Exception:
                  count = 1
              eligible = value.get("eligible_object_ids") if isinstance(value.get("eligible_object_ids"), list) else []
              patch_fields = value.get("patch_fields") if isinstance(value.get("patch_fields"), list) else []
              return {
                  "type": action_type,
                  "count": count,
                  "eligible_object_ids": [str(x) for x in eligible if x is not None][:24],
                  "patch_fields": [str(x) for x in patch_fields if str(x).strip()][:16]
              }

          def valid_underspecification(value):
              if not isinstance(value, dict):
                  return None
              missing = str(value.get("missing_detail") or "").strip()
              resolution = str(value.get("resolution") or "").strip()
              if not missing or resolution not in {"listener_choice", "clarify"}:
                  return None
              deferred = valid_deferred_action(value.get("deferred_action"))
              return {
                  "context": str(value.get("context") or "").strip(),
                  "missing_detail": missing,
                  "why_non_blocking": str(value.get("why_non_blocking") or "").strip(),
                  "resolution": resolution,
                  "choice_basis": str(value.get("choice_basis") or "").strip(),
                  "deferred_action": deferred
              }

          def open_gap(gap, turn_count, gap_type):
              base = valid_gap(gap)
              if not base:
                  return None
              base.update({
                  "opened_turn": int(turn_count or 0),
                  "gap_type": gap_type,
                  "attempts": 0,
                  "scaffold_count": 0
              })
              return base

          def trim_history(history, limit=12):
              return history[-limit:] if isinstance(history, list) else []

          def main(phase: str, summary_json: str, action_plan_text: str, gap_evaluation_text: str,
                   pedagogy_state_json: str, eval_state_json: str, repair_count,
                   student_model_json: str, gap_state_json: str) -> dict:

              summary = loads(summary_json, {})
              action_plan = loads(action_plan_text, {})
              gap_eval = loads(gap_evaluation_text, {"outcome": "none"})
              pedagogy = loads(pedagogy_state_json, {})
              eval_state = loads(eval_state_json, {})
              gap_state = loads(gap_state_json, {"pending": None, "last_outcome": "none", "history": []})

              pedagogy.setdefault("reflection_count", 0)
              pedagogy.setdefault("scaffold_count", 0)
              pedagogy.setdefault("guided_successful_actions", 0)
              pedagogy.setdefault("independent_successful_actions", 0)
              pedagogy.setdefault("underspecification_history", [])
              pedagogy.setdefault("reflection_candidate", None)

              eval_state.setdefault("baseline_captured", False)
              eval_state.setdefault("baseline_student_model_json", None)
              eval_state.setdefault("baseline_turn_count", None)
              eval_state.setdefault("independent_clarifications", 0)

              gap_state.setdefault("pending", None)
              gap_state.setdefault("last_outcome", "none")
              gap_state.setdefault("history", [])

              phase = phase or "experience"
              try:
                  repair_count = int(repair_count or 0)
              except Exception:
                  repair_count = 0

              turn_count = int(summary.get("turn_count", 0) or 0)
              current_underspecification = valid_underspecification(action_plan.get("non_blocking_underspecification"))
              actions = action_plan.get("actions", []) if isinstance(action_plan.get("actions"), list) else []

              # Deterministic invariant: a clarify-choice turn has not executed the deferred player choice.
              # Even if the LLM returns contradictory actions/action_ready, the controller treats them as deferred.
              clarify_choice = bool(current_underspecification and current_underspecification.get("resolution") == "clarify")
              if clarify_choice:
                  actions = []
                  action_ready = False
              else:
                  action_ready = bool(action_plan.get("action_ready", False)) and bool(actions)
              action_count = len(actions) if action_ready else 0

              if current_underspecification:
                  record = dict(current_underspecification)
                  record["turn"] = turn_count
                  history = pedagogy.get("underspecification_history") if isinstance(pedagogy.get("underspecification_history"), list) else []
                  history.append(record)
                  pedagogy["underspecification_history"] = history[-12:]
                  if current_underspecification.get("resolution") == "listener_choice" and action_ready:
                      pedagogy["reflection_candidate"] = {
                          "kind": "non_blocking_choice",
                          "turn": turn_count,
                          "underspecification": current_underspecification,
                          "new_action_count": action_count
                      }

              # First physical action => playable baseline before runtime execution.
              capture_baseline = False
              if action_ready and not bool(eval_state.get("baseline_captured", False)) and phase in {"experience", "practice"}:
                  eval_state["baseline_captured"] = True
                  eval_state["baseline_student_model_json"] = student_model_json
                  eval_state["baseline_turn_count"] = turn_count
                  capture_baseline = True

              correction = summary.get("correction") if isinstance(summary.get("correction"), dict) else {}
              specificity = correction.get("specificity", "none")
              off_topic = bool(summary.get("off_topic", False))

              previous_pending = valid_gap(gap_state.get("pending"))
              if previous_pending:
                  # restore lifecycle metadata from stored pending
                  for k in ("opened_turn", "gap_type", "attempts", "scaffold_count"):
                      if isinstance(gap_state.get("pending"), dict) and k in gap_state["pending"]:
                          previous_pending[k] = gap_state["pending"][k]

              current_post_gap = valid_gap(action_plan.get("post_action_gap"))
              current_blocked_gap = valid_gap(action_plan.get("blocked_now"))
              # A declared non-blocking clarify is never promoted into a fresh blocking/pending gap.
              if clarify_choice:
                  current_post_gap = None
                  current_blocked_gap = None
              candidate_new_gap = current_post_gap or current_blocked_gap
              candidate_type = "post_action" if current_post_gap else ("blocked_now" if current_blocked_gap else None)

              mode = "listener"
              intent = "ask_open_next"
              next_phase = phase
              support = None
              reset_listener = False
              reflection_basis = None

              # Transfer/complete remain terminal lesson logic.
              if phase == "transfer":
                  mode = "listener"
                  intent = "complete"
                  next_phase = "complete"

              elif phase == "complete":
                  mode = "listener"
                  intent = "complete"

              elif off_topic:
                  mode = "listener"
                  intent = "redirect"

              elif correction.get("is_correction") and specificity == "low":
                  repair_count += 1
                  mode = "repair"
                  intent = "vague_repair"
                  if repair_count >= 2:
                      support = "locate_step"

              else:
                  if correction.get("is_correction") and specificity == "specific":
                      repair_count = 0

                  # ----- EXISTING PENDING GAP: evaluate the child's current response -----
                  if previous_pending:
                      outcome = str(gap_eval.get("outcome") or "unresolved")
                      if outcome not in {"resolved", "partial", "unresolved", "changed"}:
                          outcome = "unresolved"
                      gap_state["last_outcome"] = outcome

                      if outcome == "resolved":
                          gap_state["history"].append({
                              "opened_turn": previous_pending.get("opened_turn"),
                              "closed_turn": turn_count,
                              "outcome": "resolved",
                              "gap": previous_pending,
                              "resolution_evidence": gap_eval.get("resolution_evidence", [])
                          })
                          gap_state["pending"] = None

                          gained_actionability = bool(gap_eval.get("gained_actionability", False)) and action_ready

                          # A new post-action gap can coexist with a successfully resolved old gap.
                          if candidate_new_gap:
                              gap_state["pending"] = open_gap(candidate_new_gap, turn_count, candidate_type)

                          # Reflection is earned by a real repair, and only once in the guided lesson.
                          if gained_actionability and phase in {"experience", "practice"} and int(pedagogy.get("reflection_count", 0) or 0) < 1:
                              pedagogy["reflection_count"] = 1
                              reflection_basis = {
                                  "kind": "blocking_repair",
                                  "previous_gap": previous_pending,
                                  "resolution_evidence": gap_eval.get("resolution_evidence", []),
                                  "new_action_count": action_count,
                                  "next_pending_gap": gap_state.get("pending")
                              }
                              mode = "reflection"
                              intent = "reflect_after_repair"
                              next_phase = "practice"
                          else:
                              mode = "listener"
                              intent = "act_and_gap" if gap_state.get("pending") else ("act_and_continue" if action_ready else "ask_open_next")

                      elif outcome == "changed":
                          gap_state["history"].append({
                              "opened_turn": previous_pending.get("opened_turn"),
                              "closed_turn": turn_count,
                              "outcome": "changed",
                              "gap": previous_pending,
                              "resolution_evidence": gap_eval.get("resolution_evidence", [])
                          })
                          gap_state["pending"] = open_gap(candidate_new_gap, turn_count, candidate_type) if candidate_new_gap else None
                          mode = "listener"
                          intent = "act_and_gap" if (action_ready and gap_state.get("pending")) else ("act_and_continue" if action_ready else "ask_open_next")

                      else:
                          # partial or unresolved: keep the gap alive and count repair attempts.
                          updated = valid_gap(gap_eval.get("updated_gap")) or previous_pending
                          updated["opened_turn"] = previous_pending.get("opened_turn", turn_count)
                          updated["gap_type"] = previous_pending.get("gap_type", "post_action")
                          updated["attempts"] = int(previous_pending.get("attempts", 0) or 0) + 1
                          updated["scaffold_count"] = int(previous_pending.get("scaffold_count", 0) or 0)
                          gap_state["pending"] = updated

                          # Independent performance gets clarification counts but no scaffold/reflection.
                          if phase == "independent":
                              eval_state["independent_clarifications"] = int(eval_state.get("independent_clarifications", 0) or 0) + 1
                              mode = "listener"
                              intent = "gap_followup"
                          elif updated["attempts"] >= 2:
                              updated["scaffold_count"] += 1
                              pedagogy["scaffold_count"] = int(pedagogy.get("scaffold_count", 0) or 0) + 1
                              mode = "scaffold"
                              intent = "scaffold_gap"
                          else:
                              mode = "listener"
                              intent = "gap_followup"

                  # ----- NO PREVIOUS GAP: possibly open one, but do not teach -----
                  else:
                      gap_state["last_outcome"] = "none"
                      if candidate_new_gap:
                          gap_state["pending"] = open_gap(candidate_new_gap, turn_count, candidate_type)
                          mode = "listener"
                          intent = "act_and_gap" if action_ready else "gap_followup"
                      elif current_underspecification and current_underspecification.get("resolution") == "clarify" and not action_ready:
                          # A low-stakes player choice may be clarified without becoming a pending gap.
                          gap_state["pending"] = None
                          mode = "listener"
                          intent = "clarify_choice"
                      else:
                          gap_state["pending"] = None

                          if phase == "experience":
                              mode = "listener"
                              intent = "act_and_continue" if action_ready else "ask_open_next"

                          elif phase == "practice":
                              if action_ready:
                                  pedagogy["guided_successful_actions"] = int(pedagogy.get("guided_successful_actions", 0) or 0) + action_count
                                  if pedagogy["guided_successful_actions"] >= 3:
                                      mode = "listener"
                                      intent = "fresh_listener_transition"
                                      next_phase = "independent"
                                      reset_listener = True
                                  else:
                                      mode = "listener"
                                      intent = "act_and_continue"
                              else:
                                  mode = "listener"
                                  intent = "ask_open_next"

                          elif phase == "independent":
                              if action_ready:
                                  pedagogy["independent_successful_actions"] = int(pedagogy.get("independent_successful_actions", 0) or 0) + action_count
                                  if pedagogy["independent_successful_actions"] >= 3:
                                      mode = "listener"
                                      intent = "transfer_prompt"
                                      next_phase = "transfer"
                                  else:
                                      mode = "listener"
                                      intent = "act_and_continue"
                              else:
                                  eval_state["independent_clarifications"] = int(eval_state.get("independent_clarifications", 0) or 0) + 1
                                  mode = "listener"
                                  intent = "ask_open_next"

              gap_state["history"] = trim_history(gap_state.get("history", []))

              controller = {
                  "response_mode": mode,
                  "response_intent": intent,
                  "next_phase": next_phase,
                  "capture_baseline": capture_baseline,
                  "reset_listener": reset_listener,
                  "support": support,
                  "action_ready": action_ready,
                  "interaction_progress": (
                      int(summary.get("new_fact_count", 0) or 0) > 0
                      or int(summary.get("new_instruction_count", 0) or 0) > 0
                      or action_ready
                  ),
                  "gap_outcome": gap_state.get("last_outcome"),
                  "pending_gap": gap_state.get("pending"),
                  "non_blocking_underspecification": current_underspecification,
                  "reflection_basis": reflection_basis,
                  "reflection_candidate": pedagogy.get("reflection_candidate"),
                  "core_heuristic": "What does my friend need to know before they can make the next move?"
              }

              return {
                  "response_mode": mode,
                  "controller_json": json.dumps(controller, ensure_ascii=False),
                  "reflection_basis_json": json.dumps(reflection_basis, ensure_ascii=False),
                  "gap_state_json": json.dumps(gap_state, ensure_ascii=False),
                  "phase": next_phase,
                  "pedagogy_state_json": json.dumps(pedagogy, ensure_ascii=False),
                  "eval_state_json": json.dumps(eval_state, ensure_ascii=False),
                  "repair_count": repair_count
              }
