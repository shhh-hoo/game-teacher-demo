        code: |-
          import json, re, copy

          ALLOWED_ACTIONS = {"update_object", "reveal_object", "hide_object", "remove_object", "set_turn", "set_counter", "set_status", "wait", "reset_to_baseline"}

          def loads(value, default):
              if value is None:
                  return copy.deepcopy(default)
              if isinstance(value, (dict, list)):
                  return copy.deepcopy(value)
              try:
                  return json.loads(value)
              except Exception:
                  s = str(value).strip()
                  s = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
                  s = re.sub(r"\s*```$", "", s)
                  m = re.search(r"\{.*\}", s, flags=re.S)
                  if m:
                      try:
                          return json.loads(m.group(0))
                      except Exception:
                          pass
                  return copy.deepcopy(default)

          def loads_with_status(value):
              if isinstance(value, dict):
                  return copy.deepcopy(value), True
              if value is None:
                  return {}, False
              s = str(value).strip()
              candidates = [s]
              s2 = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
              s2 = re.sub(r"\s*```$", "", s2)
              if s2 != s:
                  candidates.append(s2)
              m = re.search(r"\{.*\}", s2, flags=re.S)
              if m:
                  candidates.append(m.group(0))
              for candidate in candidates:
                  try:
                      obj = json.loads(candidate)
                      if isinstance(obj, dict):
                          return obj, True
                  except Exception:
                      pass
              return {}, False

          def merge_surface(existing, patch):
              base = dict(existing) if isinstance(existing, dict) else {}
              if not isinstance(patch, dict):
                  return base
              for k, v in patch.items():
                  if v is not None:
                      base[k] = v
              return base

          def merge_objects(existing, patch):
              by_id = {str(o.get("id")): dict(o) for o in existing if isinstance(o, dict) and o.get("id") is not None}
              for oid in patch.get("remove_object_ids", []) or []:
                  by_id.pop(str(oid), None)
              for obj in patch.get("add_objects", []) or []:
                  if isinstance(obj, dict) and obj.get("id") is not None:
                      by_id[str(obj["id"])] = dict(obj)
              for obj in patch.get("update_objects", []) or []:
                  if isinstance(obj, dict) and obj.get("id") is not None:
                      key = str(obj["id"])
                      base = by_id.get(key, {"id": obj["id"]})
                      for k, v in obj.items():
                          if k != "id" and v is not None:
                              base[k] = v
                      by_id[key] = base
              return list(by_id.values())

          def current_turn_evidence(student_model):
              turn = int(student_model.get("turn_count", 0) or 0)
              facts = [x for x in student_model.get("facts", []) if isinstance(x, dict) and int(x.get("turn", 0) or 0) == turn]
              instructions = [x for x in student_model.get("instructions", []) if isinstance(x, dict) and int(x.get("turn", 0) or 0) == turn]
              return turn, facts, instructions

          def provenance_map(guard):
              out = {}
              for item in guard.get("provenance", []) or []:
                  if not isinstance(item, dict):
                      continue
                  field = str(item.get("field") or "").strip().lower()
                  if field:
                      out[field] = str(item.get("source") or "").strip().lower()
              return out

          def field_has_student_provenance(pmap, oid, field):
              oid = str(oid).lower()
              field = str(field).lower()
              candidates = [
                  f"update_objects.{oid}.{field}",
                  f"{oid}.{field}",
                  f"objects.{oid}.{field}",
                  field,
              ]
              return any(pmap.get(key) == "student" for key in candidates)

          def setup_state_allowed(instructions):
              # A setup/state instruction may change object state in the world definition.
              return any(str(i.get("action_type") or "") == "set_state" for i in instructions)

          def prune_patch(raw_patch, render_model, student_model, guard):
              if not isinstance(raw_patch, dict):
                  return {}

              out = {}
              pmap = provenance_map(guard)
              _, facts, instructions = current_turn_evidence(student_model)

              # Keep top-level fields only when meaningfully changed.
              for key in ("name", "status", "ready", "turn"):
                  value = raw_patch.get(key)
                  if value is not None and value != render_model.get(key):
                      out[key] = value

              # Surface is a delta. Existing non-empty layout cannot drift from presentation inference.
              if isinstance(raw_patch.get("surface"), dict):
                  cur = render_model.get("surface") if isinstance(render_model.get("surface"), dict) else {}
                  delta = {}
                  for k, v in raw_patch["surface"].items():
                      if v is None or cur.get(k) == v:
                          continue
                      if cur.get(k) in (None, "", 0) or pmap.get(f"surface.{k}") == "student":
                          delta[k] = v
                  if delta:
                      out["surface"] = delta

              # New objects may contain presentation inference.
              add_objects = []
              existing_ids = {str(o.get("id")) for o in render_model.get("objects", []) if isinstance(o, dict) and o.get("id") is not None}
              for obj in raw_patch.get("add_objects", []) or []:
                  if isinstance(obj, dict) and obj.get("id") is not None and str(obj.get("id")) not in existing_ids:
                      add_objects.append(dict(obj))
              if add_objects:
                  out["add_objects"] = add_objects

              # Existing object rewrites are conservative:
              # unchanged fields are removed; new empty->filled presentation fields are okay;
              # overwriting an existing non-empty field requires student provenance,
              # except setup set_state instructions may update state.
              cur_objs = {str(o.get("id")): o for o in render_model.get("objects", []) if isinstance(o, dict) and o.get("id") is not None}
              updates = []
              allow_state_setup = setup_state_allowed(instructions)
              for obj in raw_patch.get("update_objects", []) or []:
                  if not isinstance(obj, dict) or obj.get("id") is None:
                      continue
                  oid = str(obj["id"])
                  cur = cur_objs.get(oid)
                  if cur is None:
                      continue
                  delta = {"id": obj["id"]}
                  for k, v in obj.items():
                      if k == "id" or v is None or cur.get(k) == v:
                          continue
                      if cur.get(k) in (None, "", 0):
                          delta[k] = v
                      elif k == "state" and allow_state_setup:
                          delta[k] = v
                      elif field_has_student_provenance(pmap, oid, k):
                          delta[k] = v
                  if len(delta) > 1:
                      updates.append(delta)
              if updates:
                  out["update_objects"] = updates

              removes = []
              for oid in raw_patch.get("remove_object_ids", []) or []:
                  if str(oid) in cur_objs and field_has_student_provenance(pmap, oid, "remove"):
                      removes.append(oid)
              if removes:
                  out["remove_object_ids"] = removes

              if raw_patch.get("counters") is not None and (raw_patch.get("counters") or []) != (render_model.get("counters") or []):
                  out["counters"] = raw_patch.get("counters")

              return out

          def sanitize_actions(action_plan, objects):
              ids = {str(o.get("id")) for o in objects if isinstance(o, dict) and o.get("id") is not None}
              out = []
              underspec = action_plan.get("non_blocking_underspecification") if isinstance(action_plan.get("non_blocking_underspecification"), dict) else {}
              # Deterministic invariant: `clarify` means the deferred player choice has not executed,
              # even if the LLM contradictorily emitted action_ready/actions.
              if str(underspec.get("resolution") or "").strip() == "clarify":
                  return out
              if not bool(action_plan.get("action_ready", False)):
                  return out
              for a in action_plan.get("actions", []) or []:
                  if not isinstance(a, dict) or a.get("type") not in ALLOWED_ACTIONS:
                      continue
                  t = a.get("type")
                  if t in {"reveal_object", "hide_object", "remove_object", "update_object"}:
                      oid = str(a.get("object_id") or "")
                      if oid not in ids:
                          continue
                      item = {"type": t, "object_id": oid}
                      if t == "update_object":
                          item["patch"] = {k: v for k, v in (a.get("patch") or {}).items() if v is not None}
                      out.append(item)
                  elif t == "set_turn":
                      out.append({"type": t, "to": str(a.get("to") or "")})
                  elif t == "set_counter":
                      out.append({"type": t, "counter_id": str(a.get("counter_id") or ""), "label": str(a.get("label") or ""), "value": a.get("value", 0)})
                  elif t == "set_status":
                      out.append({"type": t, "text": str(a.get("text") or "")})
                  elif t == "wait":
                      try:
                          ms = max(0, min(2000, int(a.get("ms") or 300)))
                      except Exception:
                          ms = 300
                      out.append({"type": t, "ms": ms})
                  elif t == "reset_to_baseline":
                      out.append({"type": t})
              return out

          def is_clarify_resolution(action_plan):
              underspec = action_plan.get("non_blocking_underspecification") if isinstance(action_plan.get("non_blocking_underspecification"), dict) else {}
              return str(underspec.get("resolution") or "").strip() == "clarify"

          def clarified_deferred_action(action_plan):
              underspec = action_plan.get("non_blocking_underspecification") if isinstance(action_plan.get("non_blocking_underspecification"), dict) else {}
              if not is_clarify_resolution(action_plan):
                  return None
              deferred = underspec.get("deferred_action") if isinstance(underspec.get("deferred_action"), dict) else {}
              action_type = str(deferred.get("type") or "").strip()
              if action_type not in ALLOWED_ACTIONS:
                  return None
              eligible = deferred.get("eligible_object_ids") if isinstance(deferred.get("eligible_object_ids"), list) else []
              patch_fields = deferred.get("patch_fields") if isinstance(deferred.get("patch_fields"), list) else []
              try:
                  count = max(1, int(deferred.get("count") or 1))
              except Exception:
                  count = 1
              return {
                  "type": action_type,
                  "count": count,
                  "eligible_object_ids": {str(x) for x in eligible if x is not None},
                  "patch_fields": {str(x) for x in patch_fields if str(x).strip()}
              }

          def strip_clarified_choice_effects(patch, action_plan, guard):
              """Remove pre-applied runtime effects when Jamie chose to clarify instead of act.

              The World Builder/Guard run before the Action Planner, so an LLM may have already
              placed the would-be runtime result into world_patch. This function is the final,
              deterministic enforcement point that keeps the visible world unchanged while Jamie asks.
              """
              if not is_clarify_resolution(action_plan):
                  return copy.deepcopy(patch), [], False

              deferred = clarified_deferred_action(action_plan)
              out = copy.deepcopy(patch)
              removed = []
              pmap = provenance_map(guard)

              # Clarification must not narrate/mark a runtime action as already underway. Preserve
              # these fields only when the current child message explicitly changed them.
              for field in ("status", "ready"):
                  if field in out and pmap.get(field) != "student":
                      out.pop(field, None)
                      removed.append(field)

              # Fail-safe: the planner is required to provide deferred_action for clarify. If it
              # violates that schema, freeze existing gameplay state rather than risk silently making
              # the choice before Jamie asks. Presentation/world construction may still add new objects
              # or surface details, but existing-object transitions are deferred.
              if not deferred:
                  for field in ("update_objects", "remove_object_ids", "turn", "counters"):
                      if field in out:
                          out.pop(field, None)
                          removed.append(f"fallback:{field}")
                  return out, removed, True

              action_type = deferred["type"]
              eligible = deferred["eligible_object_ids"]

              def in_scope(oid):
                  return not eligible or str(oid) in eligible

              # Object state effects corresponding to the deferred action.
              forbidden_field = None
              forbidden_value = None
              if action_type == "reveal_object":
                  forbidden_field, forbidden_value = "state", "face_up"
              elif action_type == "hide_object":
                  forbidden_field, forbidden_value = "state", "face_down"

              if forbidden_field:
                  updates = []
                  for obj in out.get("update_objects", []) or []:
                      if not isinstance(obj, dict) or obj.get("id") is None:
                          continue
                      delta = dict(obj)
                      if in_scope(obj.get("id")) and delta.get(forbidden_field) == forbidden_value:
                          delta.pop(forbidden_field, None)
                          removed.append(f"update_objects.{obj.get('id')}.{forbidden_field}={forbidden_value}")
                      if len(delta) > 1:
                          updates.append(delta)
                  if "update_objects" in out:
                      if updates:
                          out["update_objects"] = updates
                      else:
                          out.pop("update_objects", None)

              elif action_type == "remove_object":
                  vals = []
                  for oid in out.get("remove_object_ids", []) or []:
                      if in_scope(oid):
                          removed.append(f"remove_object_ids.{oid}")
                      else:
                          vals.append(oid)
                  if "remove_object_ids" in out:
                      if vals:
                          out["remove_object_ids"] = vals
                      else:
                          out.pop("remove_object_ids", None)

              elif action_type == "update_object" and deferred["patch_fields"]:
                  updates = []
                  for obj in out.get("update_objects", []) or []:
                      if not isinstance(obj, dict) or obj.get("id") is None:
                          continue
                      delta = dict(obj)
                      if in_scope(obj.get("id")):
                          for field in deferred["patch_fields"]:
                              if field in delta:
                                  delta.pop(field, None)
                                  removed.append(f"update_objects.{obj.get('id')}.{field}")
                      if len(delta) > 1:
                          updates.append(delta)
                  if "update_objects" in out:
                      if updates:
                          out["update_objects"] = updates
                      else:
                          out.pop("update_objects", None)

              elif action_type == "set_turn" and "turn" in out:
                  out.pop("turn", None)
                  removed.append("turn")

              elif action_type == "set_status" and "status" in out:
                  out.pop("status", None)
                  removed.append("status")

              elif action_type == "set_counter" and "counters" in out:
                  # A clarified counter choice has not executed. Keep setup counters only when the
                  # planner did not identify this as the deferred runtime effect. With no target
                  # counter identity in the deferred action, safest behavior is to defer the change.
                  out.pop("counters", None)
                  removed.append("counters")

              return out, removed, False

          def strip_action_effects(patch, actions):
              out = copy.deepcopy(patch)
              effects = {}
              removals = set()
              turn = None
              status = None

              for a in actions:
                  t = a.get("type")
                  oid = str(a.get("object_id") or "")
                  if t == "reveal_object" and oid:
                      effects.setdefault(oid, {})["state"] = "face_up"
                  elif t == "hide_object" and oid:
                      effects.setdefault(oid, {})["state"] = "face_down"
                  elif t == "remove_object" and oid:
                      removals.add(oid)
                  elif t == "update_object" and oid:
                      effects.setdefault(oid, {}).update(a.get("patch") or {})
                  elif t == "set_turn":
                      turn = a.get("to")
                  elif t == "set_status":
                      status = a.get("text")

              updates = []
              for obj in out.get("update_objects", []) or []:
                  oid = str(obj.get("id") or "")
                  eff = effects.get(oid, {})
                  delta = {"id": obj.get("id")}
                  for k, v in obj.items():
                      if k == "id":
                          continue
                      if k in eff and eff[k] == v:
                          continue
                      delta[k] = v
                  if len(delta) > 1:
                      updates.append(delta)
              if "update_objects" in out:
                  if updates:
                      out["update_objects"] = updates
                  else:
                      out.pop("update_objects", None)

              if removals and "remove_object_ids" in out:
                  vals = [x for x in out["remove_object_ids"] if str(x) not in removals]
                  if vals:
                      out["remove_object_ids"] = vals
                  else:
                      out.pop("remove_object_ids", None)

              if "turn" in out and out.get("turn") == turn:
                  out.pop("turn", None)
              if "status" in out and out.get("status") == status:
                  out.pop("status", None)

              return out

          def apply_actions(objects, actions):
              by_id = {str(o.get("id")): dict(o) for o in objects if isinstance(o, dict) and o.get("id") is not None}
              for a in actions:
                  t = a.get("type")
                  oid = str(a.get("object_id") or "")
                  if t in {"reveal_object", "hide_object", "remove_object", "update_object"} and oid not in by_id:
                      continue
                  if t == "reveal_object":
                      by_id[oid]["state"] = "face_up"
                  elif t == "hide_object":
                      by_id[oid]["state"] = "face_down"
                  elif t == "remove_object":
                      by_id[oid]["state"] = "removed"
                  elif t == "update_object":
                      for k, v in (a.get("patch") or {}).items():
                          if v is not None:
                              by_id[oid][k] = v
              return list(by_id.values())

          def action_label(a):
              t = a.get("type")
              oid = a.get("object_id")
              if t == "reveal_object": return f"Reveal {oid}"
              if t == "hide_object": return f"Hide {oid}"
              if t == "remove_object": return f"Remove {oid}"
              if t == "update_object": return f"Change {oid}"
              if t == "set_turn": return f"Set turn to {a.get('to')}"
              if t == "set_counter": return f"Update {a.get('label') or a.get('counter_id')}"
              if t == "set_status": return str(a.get("text") or "Update status")
              return str(a)

          def main(world_guard_text: str, action_plan_text: str, gap_evaluation_text: str, response_guard_text: str,
                   render_model_json: str, game_state_json: str, listener_model_json: str,
                   student_model_json: str, controller_json: str, gap_state_json: str, phase: str,
                   pedagogy_state_json: str, eval_state_json: str, repair_count,
                   last_action_trace_json: str) -> dict:

              guard, guard_parse_ok = loads_with_status(world_guard_text)
              action_plan, action_plan_parse_ok = loads_with_status(action_plan_text)
              response_guard, response_guard_parse_ok = loads_with_status(response_guard_text)
              controller, controller_parse_ok = loads_with_status(controller_json)
              gap_evaluation, gap_eval_parse_ok = loads_with_status(gap_evaluation_text)

              pipeline_errors = []
              if not guard_parse_ok or guard.get("parse_ok") is False:
                  pipeline_errors.append("world_builder_or_guard_parse_error")
              if not action_plan_parse_ok:
                  pipeline_errors.append("action_plan_parse_error")
              if not response_guard_parse_ok:
                  pipeline_errors.append("response_guard_parse_error")
              if not controller_parse_ok:
                  pipeline_errors.append("controller_parse_error")
              if not gap_eval_parse_ok or gap_evaluation.get("parse_ok") is False:
                  pipeline_errors.append("gap_evaluator_input_parse_error")

              render_model = loads(render_model_json, {"surface": None, "objects": [], "provenance": []})
              render_model.setdefault("objects", [])
              render_model.setdefault("provenance", [])

              student_model = loads(student_model_json, {"facts": [], "instructions": [], "messages": [], "turn_count": 0})
              raw_patch = guard.get("world_patch") if isinstance(guard.get("world_patch"), dict) else {}
              patch = prune_patch(raw_patch, render_model, student_model, guard)

              # Build provisional defined world so runtime actions may reference new objects from this turn.
              provisional = copy.deepcopy(render_model)
              if patch.get("surface") is not None:
                  provisional["surface"] = merge_surface(provisional.get("surface"), patch["surface"])
              provisional["objects"] = merge_objects(provisional.get("objects", []), patch)

              actions = sanitize_actions(action_plan, provisional.get("objects", []))

              # Invariant 1: definition delta and runtime state transition are separate.
              patch = strip_action_effects(patch, actions)

              # Invariant 2: if Jamie chose to CLARIFY an ordinary player choice, the deferred
              # runtime effect must not survive in world_patch. This closes the contradiction where
              # Jamie asks "Which one?" while the world has already revealed/changed one option.
              patch, clarify_stripped_effects, clarify_fallback = strip_clarified_choice_effects(patch, action_plan, guard)
              # Runtime-result narration is not a world definition delta unless the child explicitly changed it.
              if actions and "status" in patch and provenance_map(guard).get("status") != "student":
                  patch.pop("status", None)

              # Invariant 3: first validated physical action makes the setup playable before execution.
              if actions:
                  patch["ready"] = True

              # Render model receives definition delta only.
              if patch.get("surface") is not None:
                  render_model["surface"] = merge_surface(render_model.get("surface"), patch["surface"])
              render_model["objects"] = merge_objects(render_model.get("objects", []), patch)
              render_model["provenance"] = guard.get("provenance", []) or render_model.get("provenance", [])

              # Keep other harmless top-level render metadata if present.
              for k in ("name", "status", "ready", "turn", "counters"):
                  if k in patch and patch.get(k) is not None:
                      render_model[k] = copy.deepcopy(patch[k])

              game_state = loads(game_state_json, {"objects": [], "turn": None, "completed": False})
              # Definition/setup changes update physical state first.
              game_state["objects"] = merge_objects(game_state.get("objects", []), patch)
              if patch.get("turn") is not None:
                  game_state["turn"] = patch.get("turn")

              # Make newly rendered objects available physically without overwriting existing runtime state.
              existing_ids = {str(o.get("id")) for o in game_state.get("objects", []) if isinstance(o, dict) and o.get("id") is not None}
              for obj in render_model.get("objects", []):
                  if isinstance(obj, dict) and str(obj.get("id")) not in existing_ids:
                      game_state.setdefault("objects", []).append(copy.deepcopy(obj))

              # Runtime actions happen only after baseline has been captured client-side.
              game_state["objects"] = apply_actions(game_state.get("objects", []), actions)
              for a in actions:
                  if a.get("type") == "set_turn":
                      game_state["turn"] = a.get("to") or None
                  elif a.get("type") == "set_counter":
                      counters = {str(c.get("id")): dict(c) for c in game_state.get("counters", []) if isinstance(c, dict) and c.get("id") is not None}
                      cid = str(a.get("counter_id") or "")
                      counters[cid] = {"id": cid, "label": a.get("label") or cid, "value": a.get("value", 0)}
                      game_state["counters"] = list(counters.values())
                  elif a.get("type") == "set_status":
                      game_state["status"] = a.get("text")

              if controller.get("reset_listener"):
                  listener_model_json = json.dumps({"facts": [], "instructions": []}, ensure_ascii=False)
                  game_state = {
                      "objects": copy.deepcopy(render_model.get("objects", [])),
                      "turn": None,
                      "completed": False
                  }

              rg = response_guard
              final_reply = str(rg.get("final_reply") or "").strip()
              if not final_reply:
                  pipeline_errors.append("empty_final_reply")
                  final_reply = "I lost track of that for a second. Can you say it again?"

              trace = [action_label(a) for a in actions]
              if not trace:
                  trace = loads(last_action_trace_json, [])

              ui_action = {"type": "none", "payload": {}}
              if actions:
                  ui_action = {"type": "action_sequence", "payload": {"actions": actions}}

              support = None
              if controller.get("support") == "locate_step":
                  support = {
                      "type": "locate_step",
                      "prompt": "Which step should Jamie change?",
                      "steps": trace
                  }

              response = {
                  "reply": final_reply,
                  "phase": phase,
                  "world_patch": patch,
                  "ui_action": ui_action,
                  "support": support,
                  "capture_baseline": bool(controller.get("capture_baseline", False)),
                  "debug": {
                      "pipeline_errors": pipeline_errors,
                      "world_builder_parse_ok": bool(guard.get("parse_ok", guard_parse_ok)),
                      "world_builder_parse_error": guard.get("parse_error"),
                      "world_builder_had_patch": bool(guard.get("builder_had_patch", False)),
                      "world_builder_add_object_count": int(guard.get("builder_add_object_count", 0) or 0),
                      "world_guard_add_object_count": int(guard.get("guard_add_object_count", 0) or 0),
                      "world_guard_violations": guard.get("violations", []),
                      "response_leakage_detected": bool(rg.get("leakage_detected", False)),
                      "response_leaked_claims": rg.get("leaked_claims", []),
                      "action_plan": action_plan,
                      "clarify_invariant_enforced": is_clarify_resolution(action_plan),
                      "clarify_invariant_fallback": clarify_fallback,
                      "clarify_stripped_patch_effects": clarify_stripped_effects,
                      "gap_evaluation": gap_evaluation,
                      "gap_state": loads(gap_state_json, {"pending": None, "last_outcome": "none", "history": []}),
                      "controller": controller
                  }
              }

              return {
                  "response_json": json.dumps(response, ensure_ascii=False),
                  "render_model_json": json.dumps(render_model, ensure_ascii=False),
                  "game_state_json": json.dumps(game_state, ensure_ascii=False),
                  "listener_model_json": listener_model_json,
                  "student_model_json": student_model_json,
                  "last_action_trace_json": json.dumps(trace, ensure_ascii=False),
                  "phase": phase,
                  "pedagogy_state_json": pedagogy_state_json,
                  "eval_state_json": eval_state_json,
                  "gap_state_json": gap_state_json,
                  "repair_count": int(repair_count or 0)
              }
