        code: |-
          import json, re, copy

          def loads_status(value):
              if isinstance(value, dict):
                  return copy.deepcopy(value), True
              if value is None:
                  return {}, False
              s = str(value).strip()
              candidates = [s]
              s2 = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
              s2 = re.sub(r"\s*```$", "", s2)
              if s2 != s:
                  candidates.append(s2)
              m = re.search(r"\{.*\}", s2, flags=re.S)
              if m:
                  candidates.append(m.group(0))
              for candidate in candidates:
                  try:
                      obj = json.loads(candidate)
                      if isinstance(obj, dict):
                          return obj, True
                  except Exception:
                      pass
              return {}, False

          def loads(value, default):
              if isinstance(value, (dict, list)):
                  return copy.deepcopy(value)
              try:
                  return json.loads(value) if value is not None else copy.deepcopy(default)
              except Exception:
                  return copy.deepcopy(default)

          def valid_gap(value):
              if not isinstance(value, dict):
                  return None
              missing = str(value.get("missing_for_next_action") or "").strip()
              if not missing:
                  return None
              return {
                  "context": str(value.get("context") or "").strip(),
                  "missing_for_next_action": missing,
                  "reason": str(value.get("reason") or "").strip()
              }

          def evidence_strings(plan):
              out = []
              for item in plan.get("student_evidence", []) or []:
                  if isinstance(item, dict):
                      text = str(item.get("evidence") or "").strip()
                  else:
                      text = str(item or "").strip()
                  if text:
                      out.append(text)
              return out[:8]

          def main(gap_state_json: str, summary_json: str, action_plan_text: str) -> dict:
              gap_state = loads(gap_state_json, {"pending": None})
              summary = loads(summary_json, {})
              plan, plan_ok = loads_status(action_plan_text)

              pending = valid_gap(gap_state.get("pending"))
              if not pending:
                  result = {
                      "outcome": "none",
                      "gained_actionability": False,
                      "resolution_evidence": [],
                      "updated_gap": None,
                      "reason": "There was no pending gap to resolve.",
                      "parse_ok": plan_ok
                  }
                  return {"text": json.dumps(result, ensure_ascii=False)}

              actions = plan.get("actions", []) if isinstance(plan.get("actions"), list) else []
              action_ready = bool(plan.get("action_ready", False)) and bool(actions)
              evidence = evidence_strings(plan)
              current_gap = valid_gap(plan.get("post_action_gap")) or valid_gap(plan.get("blocked_now"))

              correction = summary.get("correction") if isinstance(summary.get("correction"), dict) else {}
              specific_correction = bool(correction.get("is_correction")) and str(correction.get("specificity") or "") == "specific"
              new_info = int(summary.get("new_fact_count", 0) or 0) + int(summary.get("new_instruction_count", 0) or 0)

              if not plan_ok:
                  outcome = "unresolved"
                  gained = False
                  updated = pending
                  reason = "Action Planner output was not parseable, so the gap remains open."
              elif action_ready and evidence:
                  # A pending listener gap is specifically about the information needed for Jamie's
                  # next transition. If the child's current contribution now directly licenses a
                  # concrete action, the listener has gained the actionability the gap was waiting for.
                  outcome = "resolved"
                  gained = True
                  updated = None
                  reason = "The current contribution directly licensed a concrete next action."
              elif specific_correction and current_gap is None and new_info > 0:
                  outcome = "changed"
                  gained = False
                  updated = None
                  reason = "The child explicitly redefined the situation, so the previous gap is no longer the right question."
              elif new_info > 0:
                  outcome = "partial"
                  gained = False
                  updated = current_gap or pending
                  reason = "The child added relevant information, but Jamie still has no newly justified next action."
              else:
                  outcome = "unresolved"
                  gained = False
                  updated = current_gap or pending
                  reason = "The current contribution did not add information that makes the next transition executable."

              result = {
                  "outcome": outcome,
                  "gained_actionability": gained,
                  "resolution_evidence": evidence if outcome in {"resolved", "changed"} else [],
                  "updated_gap": updated,
                  "reason": reason,
                  "parse_ok": plan_ok
              }
              return {"text": json.dumps(result, ensure_ascii=False)}
