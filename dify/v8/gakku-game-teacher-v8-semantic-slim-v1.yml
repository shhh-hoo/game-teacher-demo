    - data:
        code: |-
          import json, re

          def loads(value, default):
              if value is None:
                  return default
              if isinstance(value, (dict, list)):
                  return value
              try:
                  return json.loads(value)
              except Exception:
                  s = str(value).strip()
                  s = re.sub(r"^```(?:json)?\s*", "", s, flags=re.I)
                  s = re.sub(r"\s*```$", "", s)
                  m = re.search(r"\{.*\}", s, flags=re.S)
                  if m:
                      try:
                          return json.loads(m.group(0))
                      except Exception:
                          pass
                  return default

          def uniq(items, keys):
              seen = set()
              out = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  sig = tuple(str(item.get(k, "")).strip().lower() for k in keys)
                  if sig in seen:
                      continue
                  seen.add(sig)
                  out.append(item)
              return out

          def copy_list(items):
              return [dict(x) for x in items if isinstance(x, dict)]

          def main(interpreter_text: str, student_model_json: str, listener_model_json: str, student_message: str) -> dict:
              interp = loads(interpreter_text, {})
              model = loads(student_model_json, {"facts": [], "instructions": [], "messages": [], "turn_count": 0})
              model.setdefault("facts", [])
              model.setdefault("instructions", [])
              model.setdefault("messages", [])
              model["turn_count"] = int(model.get("turn_count", 0) or 0) + 1

              new_facts = interp.get("explicit_facts", []) if isinstance(interp.get("explicit_facts"), list) else []
              new_instructions = interp.get("instructions", []) if isinstance(interp.get("instructions"), list) else []

              for fact in new_facts:
                  if isinstance(fact, dict):
                      item = dict(fact)
                      item["source"] = "student"
                      item["turn"] = model["turn_count"]
                      model["facts"].append(item)

              for inst in new_instructions:
                  if isinstance(inst, dict):
                      item = dict(inst)
                      item["source"] = "student"
                      item["turn"] = model["turn_count"]
                      model["instructions"].append(item)

              model["facts"] = uniq(model["facts"], ["kind", "statement"])
              model["instructions"] = uniq(model["instructions"], ["trigger", "action_type", "description"])
              model["messages"].append({"turn": model["turn_count"], "text": student_message})
              model["messages"] = model["messages"][-6:]

              listener = {"facts": copy_list(model["facts"]), "instructions": copy_list(model["instructions"])}

              correction = interp.get("correction") if isinstance(interp.get("correction"), dict) else {}
              summary = {
                  "turn_count": model["turn_count"],
                  "new_fact_count": len(new_facts),
                  "new_instruction_count": len(new_instructions),
                  "has_instruction": len(new_instructions) > 0,
                  "off_topic": bool(interp.get("off_topic", False)),
                  "blocking_ambiguity": interp.get("blocking_ambiguity"),
                  "student_intent": interp.get("student_intent", "teach"),
                  "correction": {
                      "is_correction": bool(correction.get("is_correction", False)),
                      "specificity": correction.get("specificity", "none"),
                      "target": correction.get("target"),
                      "replacement": correction.get("replacement")
                  }
              }

              return {
                  "student_model_json": json.dumps(model, ensure_ascii=False),
                  "listener_model_json": json.dumps(listener, ensure_ascii=False),
                  "summary_json": json.dumps(summary, ensure_ascii=False)
              }
        code_language: python3
        desc: ''
